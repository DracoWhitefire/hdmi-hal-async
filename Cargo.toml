[package]
name = "hdmi-hal-async"
version = "0.2.0"
edition = "2024"
rust-version = "1.85"
readme = "README.md"
license = "MPL-2.0"
description = "Async hardware abstraction traits for the HDMI stack"
repository = "https://github.com/DracoWhitefire/hdmi-hal-async"
keywords = ["hdmi", "hal", "embedded", "async", "no-std"]
categories = ["embedded", "hardware-support", "no-std", "asynchronous"]

[dependencies]
hdmi-hal = { version = "0.4.1", default-features = false }
display-types = { version = "0.4", default-features = false }

[dev-dependencies]
pollster = { version = "0.3", features = ["macro"] }
